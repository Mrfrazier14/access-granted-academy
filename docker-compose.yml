services:
  db:
    image: postgres:16-alpine
    container_name: access-granted-academy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
      POSTGRES_DB: academy
    ports:
      - "5433:5432"
    volumes:
      - academy-db-data:/var/lib/postgresql/data

volumes:
  academy-db-data:
